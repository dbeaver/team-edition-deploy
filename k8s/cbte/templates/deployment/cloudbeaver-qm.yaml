apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: cloudbeaver-qm
  name: cloudbeaver-qm
spec:
  replicas: {{ .Values.cloudbeaverQM.replicaCount }}
  selector:
    matchLabels:
      app: cloudbeaver-qm
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        date: "{{ now | unixEpoch }}"
        {{ .Release.Name }}-net: "true"
        {{ .Release.Name }}-private-net: "true"
        app: cloudbeaver-qm
    spec:
      {{- with .Values.serviceAccount }}
      serviceAccountName: {{ .name | default "cloudbeaver" | quote }}
      {{- end }}
      # securityContext:
      #     runAsUser: 1000
      #     runAsGroup: 1000
      #     fsGroup: 1000
      #     fsGroupChangePolicy: "Always"
      containers:
        - image: "{{ .Values.cloudbeaverQM.image }}:{{ .Values.cloudbeaver.imageTag | default .Chart.AppVersion }}"
          imagePullPolicy: "{{ .Values.cloudbeaver.pullPolicy }}"
          name: cloudbeaver-qm
          env:
            - name: CLOUDBEAVER_DC_SERVER_URL
              value: "http://cloudbeaver-dc:8970/dc"
          ports:
            - containerPort: 8972
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          volumeMounts:
            - name: cross-ssl-cert
              mountPath: /opt/query-manager/conf/certificates
      {{- if .Values.cloudbeaver.pullCredsName }}
      imagePullSecrets:
        - name: {{ .Values.cloudbeaver.pullCredsName }}
      {{- end }}
      hostname: cloudbeaver-qm
      restartPolicy: Always
      volumes:
        - name: cross-ssl-cert
          secret:
            secretName: {{ .Release.Name }}-crossservice-ssl
            items:
              - key: tls.crt
                path: dc-cert.crt
